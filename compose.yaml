name: careops

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-careops}
      POSTGRES_USER: ${POSTGRES_USER:-careops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careops_local_only}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - careops-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__CareOps: Host=postgres;Port=5432;Database=${POSTGRES_DB:-careops};Username=${POSTGRES_USER:-careops};Password=${POSTGRES_PASSWORD:-careops_local_only}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-careops-local-demo-signing-key-change-before-deploying}
      DataProtection__KeysPath: /var/lib/careops/keys
      Cors__AllowedOrigins__0: http://localhost:5173
    ports:
      - "5080:8080"
    volumes:
      - careops-keys:/var/lib/careops/keys
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  careops-postgres:
  careops-keys:
