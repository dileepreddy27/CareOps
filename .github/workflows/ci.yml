name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore
        run: dotnet restore CareOps.sln --locked-mode
      - name: Build
        run: dotnet build CareOps.sln -c Release --no-restore
      - name: Test (unit + PostgreSQL Testcontainers)
        run: dotnet test CareOps.sln -c Release --no-build --logger trx --results-directory TestResults --collect:"XPlat Code Coverage"
      - name: Restore local tools
        run: dotnet tool restore
      - name: Validate idempotent migration script
        run: dotnet ef migrations script --idempotent --no-build --configuration Release --project src/CareOps.Infrastructure --startup-project src/CareOps.Api --output migration.sql
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/CareOps.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/CareOps.Web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  container:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: careops:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
